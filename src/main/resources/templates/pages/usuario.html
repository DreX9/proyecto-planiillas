<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/template :: head('Areas')"></head>

<body>
    <div class="wrapper">
        <!-- Aside -->
        <div th:replace="fragments/template :: aside"></div>

        <!-- Contenido principal -->
        <div class="main">
            <!-- Header -->
            <div th:replace="fragments/template :: header"></div>

            <!-- Main diferente en cada página -->
            <main class="p-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="mb-0">Usuarios</h2>
                            <!-- Botón que abre el modal -->
                            <button class="btn btn-primary" data-bs-toggle="modal"
                                data-bs-target="#registrarUsuarioModal">
                                Registrar
                            </button>
                        </div>



                        <!-- Tabla -->
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Empresa</th>
                                        <th>Nombre</th>
                                        <th>Area</th>
                                        <th>Cargo</th>
                                        <th>User</th>
                                        <th>Contraseña</th>
                                        <th>Acciones</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${lista}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.empleado.area.empresa.nombre}"></td>
                                        <td th:text="${user.empleado.nombre}"></td>
                                        <td th:text="${user.empleado.area.nombre}"></td>
                                        <td th:text="${user.empleado.cargo.nombre}"></td>
                                        <td th:text="${user.username}"></td>
                                        <td th:text="${user.password}"></td>
                                        <td>
                                            <a th:href="@{/usuario/edit/{id}(id=${user.id})}" class="btn btn-warning"><i
                                                    class="bi bi-pencil-square"></i></a>
                                            <form th:action="@{/usuario/delete}" method="post"
                                                class="d-inline eliminar-form">
                                                <input type="hidden" name="id" th:value="${user.id}">
                                                <button type="button" class="btn btn-danger btn-sm btn-eliminar"><i
                                                        class="bi bi-trash-fill"></i></i></button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>


                    </div>
                </div>
            </main>

            <!-- Footer -->
            <div th:replace="fragments/template :: footer"></div>
        </div>
    </div>

    <div class="modal fade" id="registrarUsuarioModal" tabindex="-1" aria-labelledby="registrarUsuarioModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="registrarUsuarioModalLabel">Registrar Areas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/usuario/save}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <!-- Empresa -->
                            <div class="col-md-6">
                                <label class="form-label">Empresa</label>
                                <select class="form-select" id="empresaSelect" required>
                                    <option value="" disabled selected>Seleccione empresa</option>
                                    <option th:each="emp : ${empresa}" th:value="${emp.id}" th:text="${emp.nombre}">
                                    </option>
                                </select>
                            </div>

                            <!-- Área -->
                            <div class="col-md-6">
                                <label class="form-label">Área</label>
                                <select class="form-select" id="areaSelect" required>
                                    <option value="" disabled selected>Seleccione área</option>
                                    <option th:each="area : ${area}" th:value="${area.id}" th:text="${area.nombre}">
                                    </option>
                                </select>
                            </div>

                            <!-- Empleado -->
                            <div class="col-md-6">
                                <label class="form-label">Empleado</label>
                                <select class="form-select" th:field="*{empleado}" id="empleadoSelect" required>
                                    <option value="" disabled selected>Seleccione empleado</option>
                                    <option th:each="emp : ${empleado}" th:value="${emp.id}" th:text="${emp.nombre}">
                                    </option>
                                </select>
                            </div>

                            <!-- Usuario -->
                            <div class="col-md-6">
                                <label class="form-label">Usuario</label>
                                <input type="text" class="form-control" th:field="*{username}"
                                    placeholder="Ingrese nombre de usuario" required>
                            </div>

                            <!-- Contraseña -->
                            <div class="col-md-6">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                    placeholder="Ingrese contraseña" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="/js/sidebar.js"></script>
<script th:if="${abrirModal}">
    document.addEventListener("DOMContentLoaded", function () {
        const modal = new bootstrap.Modal(document.getElementById('registrarUsuarioModal'));
        modal.show();
    });
</script>
<script>
    document.querySelectorAll('.btn-eliminar').forEach(btn => {
        btn.addEventListener('click', function () {
            const form = this.closest('form');
            Swal.fire({
                title: '¿Eliminar el Usuario?',
                text: "Esta acción no se puede deshacer.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });
</script>

</html>
